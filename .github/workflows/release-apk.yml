name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK with EAS
        run: eas build --platform android --profile github-release --non-interactive --wait --json > eas-build.json

      - name: Extract APK URL
        id: artifact
        run: |
          node <<'NODE'
          const fs = require('fs');

          const raw = fs.readFileSync('eas-build.json', 'utf8');
          const data = JSON.parse(raw);
          const build = Array.isArray(data) ? data[0] : data;
          const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;

          if (!url) {
            console.error('Could not find APK artifact URL in eas-build.json');
            console.error(raw);
            process.exit(1);
          }

          if (!process.env.GITHUB_OUTPUT) {
            console.error('GITHUB_OUTPUT is not set');
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'apk_url=' + url + '\n');
          NODE

      - name: Download APK
        run: curl -LfsS "${{ steps.artifact.outputs.apk_url }}" -o "localia-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: localia-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
